[project]
name = "maxautopost"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31.0",
    "maxapi>=1.2.3",
    "python-dotenv>=1.2.4",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Imports deliberately follow the environment setup in tests/support.py.
extend-select = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
# tests/support.py prepares the environment that importing src.* depends on, so
# it has to be imported before anything from src.
section-order = [
    "future",
    "standard-library",
    "third-party",
    "testing",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
testing = ["tests"]
